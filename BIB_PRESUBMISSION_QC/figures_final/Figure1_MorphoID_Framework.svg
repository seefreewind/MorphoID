   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="259.370079" y="12.63168" transform="rotate(-0 259.370079 12.63168)">What does morphology add beyond C + N + Z?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(66.238568 47.962543)">Histology</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(43.796302 61.393725)">X: fixed morphology</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(55.40931 74.764789)">representation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(219.100595 48.906606)">Measured context</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(225.440361 61.449389)">C: composition</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(205.09997 74.767016)">N: neighborhood/context</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(382.523209 47.962543)">Target and covariates</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(386.477584 61.393725)">Y: predefined target</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(373.816607 74.82268)">Z: prespecified covariates</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(67.16849 141.558007)">Conditional model comparison</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(85.792201 155.81747)">M0 = Z     M1 = C + Z</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(68.36638 169.188534)">M2 = C + N + Z     M3 = X + Z</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(89.877201 182.564052)">M4 = C + N + Z + X</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(82.501341 194.995507)">ΔR² = R²(M4) − R²(M2)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(336.470261 135.757533)">Cross-fitted residual test</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(316.050457 148.188988)">Training-side grouped cross-fitting</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(302.941941 161.562279)">M2 out-of-fold residuals → X-only model</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(307.862644 174.935571)">Test residual = Y − M2(test prediction)</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(345.443308 189.237338)">Held-out residual R²</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(331.709129 202.626215)">No full-data residualization</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(81.424427 280.86324)">Technical shortcut audit</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(90.666146 294.292195)">Stain normalization</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(109.678763 306.723651)">Grayscale</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(84.070326 320.152606)">Color / spatial controls</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(327.475691 273.232532)">Independent-unit uncertainty</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(344.646199 286.663714)">Grouped resampling</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(327.73991 299.979114)">Repeated grouped partitions</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(348.875183 314.354359)">Refit unit omission</text>
    <text style="font-size: 9.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(334.088582 326.783587)">Inference-sensitivity audit</text>
   </g>
